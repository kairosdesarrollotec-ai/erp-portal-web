name: CI

on:
  push:
    branches: [main, develop, qa, uat]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=optional

      - name: Lint (no correctivo)
        run: npm run lint --workspace apps/web

      - name: Typecheck + build (apps/web)
        run: npm run build:web

      - name: Tests + accesibilidad axe (apps/web)
        run: npm run test:web

      # SCA con allowlist. Bloquea en CRITICAL y en cualquier HIGH no registrado
      # en audit-allowlist.json. Los HIGH conocidos (undici via firebase v10)
      # estan en el allowlist con fecha de remediacion; el script verifica que
      # no hayan pasado su SLA. Agregar un nuevo HIGH al allowlist requiere razon,
      # plan de remediacion y target_date — no es exencion permanente.
      # Ver scripts/audit-check.mjs y audit-allowlist.json.
      - name: SCA / npm audit (bloqueante - high/critical con allowlist)
        run: npm run audit:prod

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=optional

      - name: Instalar navegadores Playwright (solo Chromium)
        run: npx playwright install --with-deps chromium

      - name: Tests E2E Playwright
        # El script construye en modo E2E y luego ejecuta Playwright para que
        # pueda usarse de forma reproducible tanto en CI como localmente.
        run: npm run test:e2e

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Genera SBOM de dependencias de produccion (sin dev) usando solo el
      # lock file — no requiere node_modules. Formato CycloneDX 1.5 JSON.
      - name: Generar SBOM produccion (CycloneDX JSON)
        run: npm sbom --omit dev --package-lock-only --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Publicar SBOM como artefacto CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  security:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scanning: binario oficial de gitleaks verificado por checksum
      # (sin action de terceros, que ademas exige licencia para orgs).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

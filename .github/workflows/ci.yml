name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (no correctivo)
        run: npm run lint --workspace apps/web

      - name: Typecheck + build (apps/web)
        run: npm run build:web

      - name: Tests + accesibilidad axe (apps/web)
        run: npm run test:web

      - name: SCA / npm audit (bloqueante - critical)
        # Bloquea en severidad CRITICAL. Las vulnerabilidades HIGH conocidas
        # (undici via Firebase) solo se resuelven con un salto de major de
        # Firebase, fuera de alcance actual; se reportan sin bloquear (SLA
        # KAIROS para HIGH: 7 dias).
        run: npm audit --omit=dev --audit-level=critical
      - name: SCA / npm audit (informativo - high)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegadores Playwright (solo Chromium)
        run: npx playwright install --with-deps chromium

      # Build con variables Firebase simuladas (las llamadas reales son
      # interceptadas por page.route() -- estos valores son placeholders).
      - name: Build E2E (app con variables Firebase simuladas)
        run: npm run build:web:e2e

      - name: Tests E2E Playwright
        # El reporter 'github' (playwright.config.ts) anota los fallos
        # directamente en el PR sin necesidad de subir artefactos.
        run: npm run test:e2e

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scanning: binario oficial de gitleaks verificado por checksum
      # (sin action de terceros, que ademas exige licencia para orgs).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
